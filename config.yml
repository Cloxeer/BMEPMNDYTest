  arrivedRoomText: "Follow the arrows on the plan to Room"
  arrivedBuildingText: "Choose a room on the plan for directions to it."
  arrivedNoRoomPlanText: "not on a floor plan yet."
  indoorFromDoorText: "from the nearest outside door"
  indoorFromStairsText: "from the nearest stairs"
  tapToZoomText: "tap to zoom"
  planAltText: "plan"
  postedAltText: "posted evacuation map"
  photoAltText: "Photo of"
  photoCreditText: "Photo:"
  unknownText: "Unknown"
  addressLabel: "Address"
  buildingLabel: "Building"
  numberText: "No."
  builtLabel: "Built"
  floorsLabel: "Floors"
  floorCountText: "floor count"
  codeSourceText: "Building code"
  factsSourceText: "Other facts: NMSU Office of Space Planning"
  plansNoteText: "Floor plans are unofficial, redrawn from the evacuation maps posted in the building."
  photoViewerTheme: "light"
  titleSize: "16px"
  sideWidth: "40px" # room on each side of the title: directions button left, X right
  roundButtonSize: "32px"
  roundButtonBackground: "rgba(255, 255, 255, 0.2)"
  zoomBackground: "rgba(255, 255, 255, 0.92)"
  zoomIconSize: "16px"
  arrivedIconSize: "28px"
  closeSize: "28px"
  bottomSpace: "120px"
  switchMaxWidth: "320px"
  imageRadius: "12px"
  imageShadowY: "1px"
  imageShadowBlur: "8px"
  photoWidth: "82%"
  photoRatio: "4 / 3"
  creditSize: "12px"
  captionSize: "13px"
  headingSize: "15px"
  bodySize: "14px"
  bodyLineHeight: 1.55
  labelWidth: "80px"
  labelSize: "13px"
  linkSize: "14px"
  linkWeight: 600
  sourceSize: "12px"
  bodyMaxWidthDesktop: "720px"
  imageMaxWidthDesktop: "640px"
  dividerWidth: "1px"
  viewerLayer: 13000 # full-screen picture viewer: above the sheet (12500), below the pill (15000)

directions:
  title: "Directions"
  speeds: # metres per second, for the time estimate
    walk: 1.4 # a typical walking pace
    bike: 4.2 # about 15 km/h (9 mph), relaxed city riding
    drive: 8.9 # about 32 km/h (20 mph), campus and nearby streets
  modes: # the travel switch on the directions card
    walk: { label: "Walk", icon: "directions_walk" }
    bike: { label: "Bike", icon: "directions_bike" }
    drive: { label: "Drive", icon: "directions_car" }
  modeStorageKey: "bnm_travel_mode" # this device remembers the last travel mode
  units: "imperial" # "imperial" (ft, mi) or "metric" (m, km)
  arrivedCardText: "Arrived"
  turnLeftText: "Turn left"
  turnRightText: "Turn right"
  slightLeftText: "Slight left"
  slightRightText: "Slight right"
  continueText: "Continue"
  headText: "Head" # first step: "Head north on the path"
  onText: "on"
  compass: ["north", "northeast", "east", "southeast", "south", "southwest", "west", "northwest"]
  arriveText: "Arrive at"
  ontoText: "onto"
  minText: "min"
  arrivalTimeText: "arrive"
  slightTurnDegrees: 30 # a bend sharper than this is a "slight" turn
  turnDegrees: 60 # sharper than this is a full turn
  unnamedWays: # what to call a path that has no name
    footway: "the path"
    path: "the path"
    pedestrian: "the walkway"
    steps: "the steps"
    corridor: "the corridor"
    cycleway: "the path"
    service: "the service road"
    default: "the street"
  cardMaxWidth: "420px"
  cardLayer: 10000 # above the map, below Framework7 popups (11000) and dialogs (13500)
  cardRadius: "20px"
  turnSize: "44px"
  turnRadius: "12px"
  turnIconSize: "24px"
  instructionSize: "16px"
  summarySize: "13px"
  walkIconSize: "18px"
  endIconSize: "14px"
  expandTime: "0.4s" # the card growing to show every step
  stepsMaxHeight: "50vh"
  stepSize: "15px"
  stepIconSize: "20px"
  endTripTitle: "End trip?"
  endTripText: "Are you sure you want to end your trip?"
  endTripYes: "End trip"
  endTripNo: "Keep going"
  askTitle: "Directions"
  askText: "Get directions to"
  askYes: "Go"
  askNo: "Not now"
  switchTitle: "Change destination?"
  switchFromText: "You're on your way to"
  switchToText: "Get directions to"
  switchYes: "Switch"
  switchNo: "Keep current"
  toText: "To" # the navbar title during directions: "To Zuhl Library"
  arrivedBackground: "rgba(52, 199, 89, 0.14)" # Apple system green, light
  arrivedColor: "#1d7a3a"
  indoorLineWidth: 10 # floor-plan units
  indoorArrowSize: 16 # floor-plan units
  indoorArrowSpacing: 44 # floor-plan units between arrows
  indoorStartRadius: 11 # the dot where you come in
  noLocationText: "Directions need your location. Allow location access for this site in your browser settings, then try again."
  tooFarText: "Directions work on the NMSU Las Cruces campus. Get closer to campus and try again."
  noRouteText: "No walking route was found to this building."
  loadFailedText: "Could not load the walking paths. Check your internet connection and try again."
  lineColor: "#0a84ff" # Apple system blue
  lineOpacity: 0.35
  lineWidth: 10 # px
  hopWidth: 4 # px, the dotted bits off the walkways
  arrowColor: "#0a84ff"
  arrowSize: 18 # px
  arrowSpacing: 24 # px between arrows
  rerouteMetres: 8 # only redraw the route after you've walked this far
  arrivalMetres: 5 # this close to a building's wall counts as arrived (GPS drifts near walls)
  startCandidates: 6 # try this many nearby starting points and keep the shortest trip
  startSearchMetres: 40 # ...within this much farther than the closest one
  startSpacingMetres: 5 # ...at least this far apart
  maxDistanceToNetwork: 400 # metres; farther than this from any path or road = not near campus
  searchRadius: 250 # metres around a building to look for its nearest walkway
  roomColor: "rgba(10, 132, 255, 0.28)" # the highlighted room on a floor plan (light blue)
  roomEdge: "#0a84ff"
  roomEdgeWidth: 6 # in floor-plan units

mapSettings: # the round Map settings button left of the pill (js/mapSettings.js)
  icon: "map"
  options: # top to bottom
    location: { label: "My location", icon: "location_fill" }
    follow: { label: "Turn map with me", icon: "location_north_fill" }
    names: { label: "Building names", icon: "textformat" }
    campus: { label: "Back to campus", icon: "house_fill" }
  rowHeight: "44px"
  iconCircle: "36px"
  iconSize: "18px"
  labelSize: "15px"
  followInterval: 150 # ms between map turns while following your heading
  followMinDegrees: 3 # ignore compass wobbles smaller than this
  unfollowDuration: 400 # ms to turn back to north when following stops
  compassWaitMs: 1500 # how long to wait for a first compass reading before saying there isn't one
  noCompassTitle: "Compass unavailable"
  noCompassText: "Turning the map with you needs your phone's compass. Allow motion access for this site, or try on a phone."

locate:
  beamSize: "72px" # the "which way you face" beam around your location dot
  beamWidth: "60deg"
  beamColor: "rgba(10, 132, 255, 0.45)"
  zoom: 17 # how close the map zooms in on your location
  noLocationTitle: "Location unavailable"
  noLocationText: "Allow location access for this site in your browser settings, then try again."
  outsideText: "You're outside the NMSU campus map."

locations:
  acresText: "acres"

settings:
  buildingNamesKey: "bnm_building_names" # where this device remembers the Building names switch

welcome:
  storageKey: "bnm_visited"
  titleLineHeight: 1.15
  byline: "rgba(255, 255, 255, 0.85)"

